services:
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: maxsport:local
    environment:
      DATABASE_URL: postgresql://maxsport:${POSTGRES_PASSWORD:-maxsport}@postgres:5432/maxsport
    command: ["node", "apps/api/dist/migrate.js"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: maxsport:local
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://maxsport:${POSTGRES_PASSWORD:-maxsport}@postgres:5432/maxsport
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://localhost:3000
      PORT: "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maxsport}
